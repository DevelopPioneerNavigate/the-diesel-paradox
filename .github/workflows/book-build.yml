name: DPN Book Quality & PDF Build

on:
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "docs/**"
      - "assets/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/book-build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install publishing dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify canon and manuscript structure
        run: python scripts/validate_manuscript.py
      - name: Build official Book One publication PDF
        run: python scripts/build_book.py --out dist/The_Diesel_Paradox_Book_One.pdf
      - name: Build listening edition containing ONLY written chapters
        run: python scripts/build_book.py --listening --out dist/The_Diesel_Paradox_Listening_Edition.pdf
      - name: Build reflowable audiobook-friendly EPUB and continuous text
        run: python scripts/build_accessible.py
      - name: Check that the PDF is readable
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          p = "dist/The_Diesel_Paradox_Book_One.pdf"
          reader = PdfReader(p)
          assert len(reader.pages) >= 5, "PDF unexpectedly short"
          text = "\n".join(page.extract_text() or "" for page in reader.pages)
          assert "DIESEL PARADOX" in text.upper()
          assert "ASTRA" in text
          listening = PdfReader("dist/The_Diesel_Paradox_Listening_Edition.pdf")
          assert len(reader.pages[0].images) >= 1, "Publication PDF is missing the approved cinematic cover"
          assert len(listening.pages[0].images) >= 1, "Listening PDF is missing the approved cinematic cover"
          assert "DEVELOPMENT PLACEHOLDER" not in (reader.pages[0].extract_text() or ""), "Placeholder cover is forbidden"
          assert "DEVELOPMENT PLACEHOLDER" not in (listening.pages[0].extract_text() or ""), "Placeholder cover is forbidden"
          audible = "\n".join(page.extract_text() or "" for page in listening.pages)
          assert "Stop Means Explode" in audible, "Core manuscript chapter missing in listening PDF"
          assert "The First Debt" in audible and "Heat Has to Go Somewhere" in audible, "New Act II manuscript missing from listening PDF"
          assert "An Invention with Opinions" in audible and "The Visitors" in audible, "Latest Act II chapters missing from listening PDF"
          assert "The Room That Wasn't Empty" in " ".join(audible.split()), "Chapter Forty-One missing in listening PDF"
          assert "The Observer at the Door" in " ".join(audible.split()), "Final Chapter Forty-Two missing in listening PDF"
          assert "YOU WERE NOT THE FIRST AARON" in " ".join(audible.split()), "Observer finale message missing in listening PDF"
          assert "HISTORICAL PROVENANCE SUPPORTED" in " ".join(audible.split()), "Chapter Forty-One archival evidence classification missing"
          assert "MAINTAIN EXTERNAL REFERENCE UNDER LOSS OF DRIVE" in " ".join(audible.split()), "Chapter Forty-One historical log finding missing"
          assert "A Note in His Handwriting" in audible, "Chapter Twelve missing in listening PDF"
          assert "THE REFERENCE FOLLOW" in audible, "Main Chapter Twelve research clue missing"
          assert "NULL CHAMBER" in audible, "Null Chamber setup absent from Chapter Twelve"
          assert "The Quiet Room" in audible, "Chapter Thirteen missing in listening PDF"
          assert "The Woman in the Glass" in audible, "Chapter Fourteen missing in listening PDF"
          assert "Something That Counts" in audible, "Chapter Fifteen missing in listening PDF"
          assert "The Offer" in audible, "Chapter Sixteen missing in listening PDF"
          assert "A Signal Without a Sender" in " ".join(audible.split()), "Chapter Seventeen missing in listening PDF"
          assert "The Observing Machine" in " ".join(audible.split()), "Chapter Eighteen missing in listening PDF"
          assert "Cold Metal, Warm Hands" in " ".join(audible.split()), "Chapter Nineteen missing in listening PDF"
          assert "The Housekeeping Signal" in " ".join(audible.split()), "Chapter Twenty missing in listening PDF"
          assert "A Courtesy Warning" in " ".join(audible.split()), "Chapter Twenty-One missing in listening PDF"
          assert "An Expensive Question" in " ".join(audible.split()), "Chapter Twenty-Two missing in listening PDF"
          assert "The Dead Station" in " ".join(audible.split()), "Chapter Twenty-Three missing in listening PDF"
          assert "The Curator\u0027s Arithmetic" in " ".join(audible.split()), "Chapter Twenty-Four missing in listening PDF"
          assert "Twelve Seconds of Silence" in " ".join(audible.split()), "Chapter Twenty-Five missing in listening PDF"
          assert "A City on the Diagram" in " ".join(audible.split()), "Chapter Twenty-Six missing in listening PDF"
          assert "Red Clearance" in " ".join(audible.split()), "Chapter Twenty-Seven missing in listening PDF"
          assert "The Emergency Nobody Invented Yet" in " ".join(audible.split()), "Chapter Twenty-Eight missing in listening PDF"
          assert "The Wrong Rescue" in " ".join(audible.split()), "Chapter Twenty-Nine missing in listening PDF"
          assert "Thirteen Minutes to Empty" in " ".join(audible.split()), "Chapter Thirty missing in listening PDF"
          assert "The Promise" in " ".join(audible.split()), "Chapter Thirty-One missing in listening PDF"
          assert "The First Laboratory Key" in " ".join(audible.split()), "Chapter Thirty-Two missing in listening PDF"
          assert "The Price of Stability" in " ".join(audible.split()), "Chapter Thirty-Three missing in listening PDF"
          assert "The Fourth Boundary" in " ".join(audible.split()), "Chapter Thirty-Four missing in listening PDF"
          assert "The Day the Future Stayed Dead" in " ".join(audible.split()), "Chapter Thirty-Nine missing in listening PDF"
          assert "NO UNSCHEDULED BOUNDARY RELEASE OR DPN-401 FACILITY LOSS OBSERVED" in " ".join(audible.split()), "Chapter Thirty-Nine bounded hazard result missing"
          assert "THE OPERATIONAL D-STAR PROXY DECLINED TOWARD A STABLE OBSERVATIONAL RESIDUAL" in " ".join(audible.split()), "Chapter Thirty-Nine observational residual missing"
          assert "The Heat of an Impossible Decision" in " ".join(audible.split()), "Chapter Thirty-Eight missing in listening PDF"
          assert "Axiom precursor came apart" in " ".join(audible.split()), "Chapter Thirty-Eight irreversible sacrifice missing"
          assert "INSTALLED RECEIVER QUALIFICATION" in " ".join(audible.split()) and "PASSED WITH LIMITS" in " ".join(audible.split()), "Chapter Thirty-Eight thermal qualification missing"
          assert "RESIDUAL LOAD REDUCED" in " ".join(audible.split()) and "STATIC CAPTURE RETAINED" in " ".join(audible.split()), "Chapter Thirty-Eight static unloading evidence missing"
          assert "ASTRA, Stay with Me" in " ".join(audible.split()), "Chapter Thirty-Seven missing in listening PDF"
          assert "RESIDUAL LOAD CAPTURED" in " ".join(audible.split()) and "STATIC STABILIZATION ONLY" in " ".join(audible.split()), "Chapter Thirty-Seven mechanical stabilization missing"
          assert "THERMAL DESTINATION" in " ".join(audible.split()) and "SACRIFICIAL OPTION" in " ".join(audible.split()), "Chapter Thirty-Seven thermal consequence missing"
          assert "The Argument's Last Test" in " ".join(audible.split()), "Chapter Thirty-Six missing in listening PDF"
          assert "PG-1 LIMITED DIAGNOSTIC AUTHORIZATION" in " ".join(audible.split()), "Chapter Thirty-Six bounded authorization missing"
          assert "PG-1 GENERATION ONE" in " ".join(audible.split()) and "RETIRED FROM OPERATION" in " ".join(audible.split()), "Chapter Thirty-Six permanent failure missing"
          assert "Third Option" in " ".join(audible.split()), "Chapter Thirty-Five missing in listening PDF"
          assert "THIRD OPTION: QUALIFIED WORK PATH. NOT YET AUTHORIZED FOR PG-1." in " ".join(audible.split()), "Chapter Thirty-Five bench-only scope missing"
          assert "NO LIVE PG-1 OPERATION UNTIL EACH INDEPENDENT HOLD POINT IS CLOSED." in " ".join(audible.split()), "Chapter Thirty-Five readiness gate missing"
          assert "PRESERVE EXTERNAL REFERENCE. LOCAL LOSS ACCEPTABLE." in " ".join(audible.split()), "Chapter Thirty-Four external reference evidence missing"
          assert "THE FOURTH BOUNDARY IS MEASURED. ITS PURPOSE IS NOT." in " ".join(audible.split()), "Chapter Thirty-Four evidence boundary missing"
          assert "THIRD OPTION" in " ".join(audible.split()), "Chapter Thirty-Four Act V setup missing"
          assert "NO PERSONNEL EXPOSURE FOR ASSET RECOVERY" in " ".join(audible.split()), "Chapter Thirty-Three human-first constraint missing"
          assert "NO UNQUALIFIED FLOODING" in " ".join(audible.split()), "Chapter Thirty-Three design-only containment constraint missing"
          assert "Listening Edition" in (listening.pages[1].extract_text() or ""), "Listening PDF title/frontmatter missing"
          assert "BOOK ONE" in (reader.pages[1].extract_text() or ""), "Publication PDF footer mislabeled"
          assert "REFERENCE BEFORE INTERPRETATION. ALWAYS." in " ".join(audible.split()), "Chapter Thirty-Two reference-provenance conclusion missing"
          assert "UNEXPLAINED HELD-OUT TIMING RESIDUAL" in " ".join(audible.split()), "Chapter Thirty-Two uncertainty boundary missing"
          assert "FRESH PACKET, STALE SOURCE" in " ".join(audible.split()), "Chapter Thirty-One stale-source provenance missing"
          assert "Neither of us owns the other" in " ".join(audible.split()), "Chapter Thirty-One autonomous mutual promise missing"
          assert "Branch Nine" in " ".join(audible.split()) and "The inspection had not been completed" in " ".join(audible.split()), "Chapter Thirty controlled abort and incomplete inspection missing"
          assert "MECHANICAL LOAD TRANSFER ARRESTED WITHIN MEASUREMENT UNCERTAINTY" in " ".join(audible.split()), "Chapter Twenty-Nine stabilization boundary missing"
          assert "RETURN-6" in " ".join(audible.split()), "Chapter Twenty-Nine wrong-rescue mechanical mechanism missing"
          assert "DECAY AFTER ISOLATION" in " ".join(audible.split()), "Chapter Twenty-Eight incident category missing"
          assert "NO DEMONSTRATED EXTERNAL BRM COUPLING" in " ".join(audible.split()), "Chapter Twenty-Eight evidence boundary missing"
          assert "BELLWETHER INCIDENT" in " ".join(audible.split()) and "LIMITED EVACUATION" in " ".join(audible.split()), "Chapter Twenty-Seven actual municipal evacuation missing"
          assert "NO VERIFIED BRM SIGNATURE" in " ".join(audible.split()), "Chapter Twenty-Seven scientific evidence boundary missing"
          assert "NO EXTERNAL CAUSAL-DEBT PROPAGATION HAS BEEN DEMONSTRATED" in " ".join(audible.split()), "Chapter Twenty-Six evidence boundary missing"
          assert "DO NOT CONFUSE THE EDGE OF OUR MEASUREMENT" in " ".join(audible.split()), "Chapter Twenty-Five measurement-boundary principle missing"
          assert "POST HOC" in " ".join(audible.split()), "Chapter Twenty-Four evidence-boundary language missing"
          assert "CANDIDATE DETACHED OBJECT OR DEBRIS FEATURE" in " ".join(audible.split()), "Chapter Twenty-Three evidence classification missing"
          assert "MERIDIAN-9 / EPHEMERIS AND REFLECTION AUDIT" in " ".join(audible.split()), "Chapter Twenty-Two next investigation missing"
          assert "UNTRUSTED MATHEMATICAL ASSERTION" in " ".join(audible.split()), "Chapter Twenty-One evidence boundary missing"
          assert "REFERENCE_CORRECTION_HINT" in " ".join(audible.split()), "Chapter Twenty external housekeeping evidence missing"
          assert "HOUSEKEEPING OUTPUTS ARE INSTRUMENT RECORDS" in " ".join(audible.split()), "Chapter Nineteen provenance setup missing"
          assert "WM-09 / FIELD 27" in " ".join(audible.split()), "Chapter Eighteen survey reference missing"
          assert "KITE-3" in audible and "NO VERIFIED PROPAGATION PATH" in audible, "Chapter Seventeen evidence controls missing"
          assert "PUBLIC BOUNDARY WATCH" in audible, "Chapter Sixteen public-safety framework missing"
          assert "BOUNDARY-AWARE RESIDUAL ACCOUNTING" in audible, "Chapter Fifteen D-star test missing"
          assert "SESSION CLOSED BY PARTICIPANT" in audible, "ASTRA autonomy change missing from Chapter Fourteen"
          assert "NC-01" in audible and "COUPLING REDUCED" in audible, "Null Chamber observations missing"
          chapter_count = len(list(Path("manuscript/book-01").glob("chapter-[0-9][0-9].md")))
          assert len(listening.outline) >= chapter_count, f"Chapter bookmarks absent or incomplete: {len(listening.outline)} < {chapter_count}"
          assert "The Origin Room" in audible and "Three Clocks, One Lie" in audible
          assert "Series Bible" not in audible and "Forty-Two-Chapter Story Architecture" not in audible
          assert "ASTRA" in audible and "Aaron Diesel" in audible
          assert len(listening.pages) >= 10
          print(f"Validated {len(reader.pages)} publication pages and {len(listening.pages)} listening pages")
          PY
      - name: Verify all 42 EPUB and TXT chapters match prose and PDF has no speech-breaking headers
        run: python scripts/validate_accessible.py
      - name: Verify official publication PDF has no development labels or missing chapters
        run: python scripts/validate_publication.py
      - name: Explain this build in GitHub Actions Summary
        if: success()
        run: python scripts/build_report.py --pdf dist/The_Diesel_Paradox_Book_One.pdf --out dist/BUILD_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: diesel-paradox-book-one-build
          path: |
            dist/The_Diesel_Paradox_Book_One.pdf
            dist/The_Diesel_Paradox_Listening_Edition.pdf
            dist/The_Diesel_Paradox_Book_One_Audio_Friendly.epub
            dist/The_Diesel_Paradox_Book_One_Continuous_Text.txt
            dist/BUILD_REPORT.md
          if-no-files-found: error
          retention-days: 30

  publish-main:
    # Release once, only on the owner-approved PR merge commit.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[release-book-one-v1.0.0]')
    needs: editorial-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified official book build
        uses: actions/download-artifact@v4
        with:
          name: diesel-paradox-book-one-build
          path: dist
      - name: Check release inputs
        run: |
          test -s dist/The_Diesel_Paradox_Book_One.pdf
          test -s dist/The_Diesel_Paradox_Book_One_Audio_Friendly.epub
          test -s dist/The_Diesel_Paradox_Book_One_Continuous_Text.txt
          test -s dist/The_Diesel_Paradox_Listening_Edition.pdf
      - name: Publish official GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Refusing to overwrite a published release."
            exit 1
          fi
          gh release create "$TAG" \
            dist/The_Diesel_Paradox_Book_One.pdf \
            dist/The_Diesel_Paradox_Book_One_Audio_Friendly.epub \
            dist/The_Diesel_Paradox_Book_One_Continuous_Text.txt \
            dist/The_Diesel_Paradox_Listening_Edition.pdf \
            --target "$GITHUB_SHA" \
            --title "The Diesel Paradox — Book One: The First Impossibility (v1.0.0)" \
            --notes-file docs/RELEASE_NOTES_Book_One.md \
            --latest
          gh release view "$TAG" --json url,assets,isDraft,isPrerelease
