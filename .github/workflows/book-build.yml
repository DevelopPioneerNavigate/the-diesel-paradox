name: DPN Book Quality & PDF Build

on:
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "docs/**"
      - "assets/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/book-build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install publishing dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify canon and manuscript structure
        run: python scripts/validate_manuscript.py
      - name: Build DPN-themed development edition
        run: python scripts/build_book.py --out dist/The_Diesel_Paradox_Development_Edition.pdf
      - name: Build listening edition containing ONLY written chapters
        run: python scripts/build_book.py --listening --out dist/The_Diesel_Paradox_Listening_Edition.pdf
      - name: Check that the PDF is readable
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          p = "dist/The_Diesel_Paradox_Development_Edition.pdf"
          reader = PdfReader(p)
          assert len(reader.pages) >= 5, "PDF unexpectedly short"
          text = "\n".join(page.extract_text() or "" for page in reader.pages)
          assert "DIESEL PARADOX" in text.upper()
          assert "ASTRA" in text
          listening = PdfReader("dist/The_Diesel_Paradox_Listening_Edition.pdf")
          audible = "\n".join(page.extract_text() or "" for page in listening.pages)
          assert "Stop Means Explode" in audible, "Core manuscript chapter missing in listening PDF"
          assert "The First Debt" in audible and "Heat Has to Go Somewhere" in audible, "New Act II manuscript missing from listening PDF"
          assert "An Invention with Opinions" in audible and "The Visitors" in audible, "Latest Act II chapters missing from listening PDF"
          assert len(listening.outline) >= 11, "Chapter bookmarks absent or incomplete"
          assert "The Origin Room" in audible and "Three Clocks, One Lie" in audible
          assert "Series Bible" not in audible and "Forty-Two-Chapter Story Architecture" not in audible
          assert "ASTRA" in audible and "Aaron Diesel" in audible
          assert len(listening.pages) >= 10
          print(f"Validated {len(reader.pages)} development pages and {len(listening.pages)} listening pages")
          PY
      - name: Explain this build in GitHub Actions Summary
        if: success()
        run: python scripts/build_report.py --pdf dist/The_Diesel_Paradox_Development_Edition.pdf --out dist/BUILD_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: diesel-paradox-development-edition
          path: |
            dist/The_Diesel_Paradox_Development_Edition.pdf
            dist/The_Diesel_Paradox_Listening_Edition.pdf
            dist/BUILD_REPORT.md
          if-no-files-found: error
          retention-days: 30

  publish-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs: editorial-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_book.py --out books/The_Diesel_Paradox_Development_Edition.pdf
      - name: Commit the one canonical development PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/The_Diesel_Paradox_Development_Edition.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(book): regenerate development edition PDF [skip ci]"
            git push
          fi
